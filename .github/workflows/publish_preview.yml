name: Publish (Preview)
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: ./.github/actions/ci-setup

      - name: Build
        run: pnpm build

      - run: pnpm dlx pkg-pr-new publish --pnpm --comment=off './packages/*'
