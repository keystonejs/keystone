name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The npm dist-tag to apply on approval'
        required: true
        type: choice
        options:
          - latest
          - rc

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Release
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: true # needed for git push

      - uses: ./.github/actions/ci-setup

      - name: git config
        run: |
          git config --global user.name 'Keystonejs Release Bot'
          git config --global user.email 'automation+keystonejs@thinkmill.com.au'

      - name: version packages
        if: inputs.tag != 'latest'
        run: |
          pnpm changeset version --snapshot ${{ inputs.tag }}
          git commit -a -m 'rc'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm build

      - name: Resolve starter catalog dependencies
        run: pnpm resolve:create-starter-catalog

      - name: Stage packages on npm
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: pnpm stage publish --recursive --filter './packages/*' --access public --tag "$NPM_TAG" --no-git-checks --report-summary

      # Preserve the source commit for each staged package, including RC snapshots.
      - name: Push source tags for staged packages
        shell: bash
        run: |
          jq -r '.publishedPackages[] | "\(.name)@\(.version)"' pnpm-publish-summary.json |
            while IFS= read -r tag; do
              git tag "$tag"
            done
          git push origin --tags
