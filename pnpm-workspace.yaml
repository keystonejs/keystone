  '@prisma/internals': 7.9.0
  prisma: ^7.9.0
  better-sqlite3: ^12.6.0
  '@types/express': ^5.0.6
  '@types/node': ^24.0.0
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  express: ^5.2.1
  graphql: ^16.14.2
  next: ^16.2.10
  mariadb: 3.4.5
  pg: ^8.16.3
  react: ^19.2.4
  react-dom: ^19.2.4
  typescript: ^6.0.0
  '@keystar/ui': ~0.9.6
  '@keystatic/core': 0.6.7
  react-aria: 3.50.0
  react-stately: 3.48.0
allowBuilds:
